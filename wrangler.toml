name = "sprout"
compatibility_date = "2025-09-22"
compatibility_flags = ["nodejs_compat"]

main = ".svelte-kit/cloudflare/_worker.js"

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

# NOTE: local dev stores D1 in .wrangler/state, keyed by a hash of database_id.
# Changing database_id below creates a *fresh, empty* local database — re-run
# `pnpm db:migrate:local` (and `pnpm content:import`) or every route will 500
# with "no such table: nodes".
#
# `pnpm bootstrap` fills these three placeholders in for you.
[[d1_databases]]
binding = "DB"
database_name = "sprout"
database_id = "YOUR_D1_DATABASE_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "sprout-media"
